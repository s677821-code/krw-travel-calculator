<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>韓國旅遊記帳</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 15px;
      background: #f7f7f7;
    }

    h2, h3 {
      margin: 10px 0;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      background: white;
    }

    th, td {
      border-bottom: 1px solid #ddd;
      padding: 8px;
      text-align: center;
      font-size: 14px;
    }

    .delete-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      padding: 6px;
      appearance: none;
      -webkit-appearance: none;
    }

    .summary {
      background: white;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      font-size: 15px;
    }

    .total {
      font-size: 20px;
      margin-top: 10px;
      text-align: right;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h2>🇰🇷 韓國旅遊記帳</h2>

<label>匯率（僅用於韓元 → 台幣）</label>
<input id="rate" type="number" step="0.0001" value="0.024">

<h3>➕ 新增消費</h3>

<input id="item" placeholder="消費項目（例：咖啡）">

<select id="category">
  <option>餐飲</option>
  <option>交通</option>
  <option>購物</option>
  <option>其他</option>
</select>

<select id="currency">
  <option value="KRW">韓元（KRW）</option>
  <option value="TWD">台幣（TWD）</option>
</select>

<input id="amount" type="number" placeholder="金額">

<button id="addBtn" type="button">加入記帳</button>

<table>
  <thead>
    <tr>
      <th>項目</th>
      <th>原始金額</th>
      <th>TWD</th>
      <th>🗑️</th>
    </tr>
  </thead>
  <tbody id="list"></tbody>
</table>

<h3>📊 類別小計（TWD）</h3>
<div id="summary" class="summary"></div>

<div class="total">
  總計：<span id="total">0</span> TWD
</div>

<script>
  let expenses = JSON.parse(localStorage.getItem("expenses")) || [];

  const list = document.getElementById("list");
  const totalEl = document.getElementById("total");
  const summaryEl = document.getElementById("summary");

  function toTWD(expense, rate) {
    // ⭐ 關鍵修正：台幣就是台幣，不換算
    if (expense.currency === "TWD") {
      return expense.amount;
    }
    return expense.amount * rate;
  }

  function render() {
    list.innerHTML = "";
    summaryEl.innerHTML = "";

    const rate = Number(document.getElementById("rate").value);
    let total = 0;

    const categoryTotal = {
      餐飲: 0,
      交通: 0,
      購物: 0,
      其他: 0
    };

    expenses.forEach((e, index) => {
      const twd = toTWD(e, rate);
      total += twd;
      categoryTotal[e.category] += twd;

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${e.item}</td>
        <td>${e.currency} ${e.amount}</td>
        <td>${twd.toFixed(2)}</td>
        <td>
          <button class="delete-btn" data-index="${index}">🗑️</button>
        </td>
      `;
      list.appendChild(tr);
    });

    totalEl.innerText = total.toFixed(2);

    Object.keys(categoryTotal).forEach(cat => {
      summaryEl.innerHTML += `<div>${cat}：${categoryTotal[cat].toFixed(2)} TWD</div>`;
    });

    localStorage.setItem("expenses", JSON.stringify(expenses));
  }

  document.getElementById("addBtn").addEventListener("click", () => {
    const item = document.getElementById("item").value.trim();
    const category = document.getElementById("category").value;
    const currency = document.getElementById("currency").value;
    const amount = Number(document.getElementById("amount").value);

    if (!item || amount <= 0) {
      alert("請輸入正確資料");
      return;
    }

    expenses.push({ item, category, currency, amount });
    render();

    document.getElementById("item").value = "";
    document.getElementById("amount").value = "";
  });

  // ⭐ 事件委派：刪除永遠有效（手機穩）
  list.addEventListener("click", e => {
    if (e.target.classList.contains("delete-btn")) {
      const index = Number(e.target.dataset.index);
      expenses.splice(index, 1);
      render();
    }
  });

  render();
</script>

</body>
</html>
